# coturn configuration for the portal's TURN relay.
#
# The two offices sit behind NATs that refuse direct UDP to each other: ICE
# gathers reflexive candidates on both sides, exchanges them, sends connectivity
# checks, and receives no response at all. A relay is the only path between
# them, and this is it.
#
# Install on Ubuntu:
#   sudo apt update && sudo apt install -y coturn
#   sudo install -m 640 -o root -g turnserver turnserver.conf /etc/turnserver.conf
#   sudo sed -i 's/#TURNSERVER_ENABLED=1/TURNSERVER_ENABLED=1/' /etc/default/coturn
#   sudo systemctl restart coturn
#
# The ownership above is not cosmetic. coturn runs as the `turnserver` user, and
# if it cannot read this file it does not fail - it starts with ALL DEFAULTS and
# logs nothing about it. That means no external-ip, the default relay port
# range, and, because lt-cred-mech is one of the settings lost, no
# authentication: the server becomes an open relay that anyone can use. Verify
# with `sudo -u turnserver test -r /etc/turnserver.conf` after installing.
#
# See docs/TURN_SETUP.md for the Oracle Cloud specifics, which is where the
# fiddly parts are.

# --- Credentials -------------------------------------------------------------
# Long-term credentials: one static user, handed to both displays by /api/ice.
# The realm is part of the credential hash, so changing it invalidates every
# password.
lt-cred-mech
realm=portal
user=portal:REPLACE_WITH_A_LONG_RANDOM_PASSWORD

# --- Addressing --------------------------------------------------------------
# This is the setting that breaks Oracle deployments. The instance sees only its
# private address; the public address is NAT'd onto it and never appears on the
# interface. Without external-ip, coturn allocates relay candidates advertising
# the private address, which no office can reach - and the symptom is identical
# to having no TURN server at all.
listening-ip=0.0.0.0
external-ip=REPLACE_PUBLIC_IP/REPLACE_PRIVATE_IP

listening-port=3478

# --- Relay ports -------------------------------------------------------------
# Deliberately narrow. Every port in this range has to be opened twice on Oracle
# (security list and instance firewall), and two offices need only a handful.
# Widen it if you ever add more displays.
min-port=49160
max-port=49200

# --- Hardening ---------------------------------------------------------------
# An open TURN server is a bandwidth amplifier and an SSRF pivot: anyone who can
# authenticate can ask it to relay to arbitrary addresses, including private
# ranges inside whatever network it sits in. Refuse those explicitly.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255

no-multicast-peers
# The admin CLI listens on localhost with a default password and is not needed.
no-cli
fingerprint
stale-nonce=600

# Log to syslog so journalctl -u coturn shows both systemd and coturn output.
# Pointing log-file at /var/log directly does not work: the turnserver user
# cannot create a file there, and coturn falls back to a file of its own
# choosing, so `journalctl` looks silent and the startup config is invisible -
# which is exactly what you need to see when diagnosing this.
simple-log
log-file=syslog
