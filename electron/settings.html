<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portal Settings</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 24px 28px 20px;
    background: #16181d;
    color: #e8e8ea;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #8b8f98; font-size: 12px; margin: 0 0 20px; }
  label { display: block; margin: 14px 0 5px; font-weight: 600; }
  .hint { font-weight: 400; color: #8b8f98; }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 7px 9px;
    background: #0f1114; border: 1px solid #333840; border-radius: 5px;
    color: #e8e8ea; font: inherit;
  }
  input:focus { outline: none; border-color: #4c8dff; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; }
  .check label { margin: 0; font-weight: 400; }
  footer { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  button {
    padding: 7px 15px; border-radius: 5px; border: 1px solid #333840;
    background: #22262d; color: #e8e8ea; font: inherit; cursor: pointer;
  }
  button.primary { background: #2f6fe4; border-color: #2f6fe4; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { flex: 1; font-size: 12px; }
  #msg.err { color: #ff8080; }
  #msg.ok { color: #6cd08a; }
  code { color: #a9b2c0; font-size: 11px; word-break: break-all; }
  .warn {
    margin: -12px 0 18px; padding: 8px 10px; border-radius: 5px;
    background: #3a2a12; border: 1px solid #6b4a18; color: #ffcf8f; font-size: 12px;
  }
</style>
</head>
<body>
  <h1>Portal Settings</h1>
  <p class="sub">Saved to <code id="path">…</code></p>
  <p id="envWarn" class="warn" hidden></p>

  <label for="portalUrl">Server URL</label>
  <input id="portalUrl" type="text" spellcheck="false" placeholder="https://dy-portal.onrender.com">

  <label for="password">Password <span class="hint" id="pwHint"></span></label>
  <input id="password" type="password" placeholder="Leave blank to keep current">

  <div class="row">
    <div>
      <label for="localOffice">This display is <span class="hint">(local)</span></label>
      <input id="localOffice" type="text" spellcheck="false" placeholder="office-ny">
    </div>
    <div>
      <label for="remoteOffice">It calls <span class="hint">(remote)</span></label>
      <input id="remoteOffice" type="text" spellcheck="false" placeholder="office-serbia">
    </div>
  </div>

  <div class="check">
    <input id="kiosk" type="checkbox">
    <label for="kiosk">Kiosk mode <span class="hint">— blocks app switching and exiting fullscreen</span></label>
  </div>

  <div class="check">
    <input id="launchAtLogin" type="checkbox">
    <label for="launchAtLogin">Launch at login <span class="hint" id="launchHint"></span></label>
  </div>

  <footer>
    <span id="msg"></span>
    <button id="cancel">Cancel</button>
    <button id="save" class="primary">Save &amp; Reload</button>
  </footer>

<script>
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = kind || '';
  }

  (async () => {
    const cfg = await window.portalSettings.load();
    $('path').textContent = cfg.configPath;
    $('portalUrl').value = cfg.portalUrl || '';
    $('localOffice').value = cfg.localOffice || '';
    $('remoteOffice').value = cfg.remoteOffice || '';
    $('kiosk').checked = !!cfg.kiosk;
    $('launchAtLogin').checked = !!cfg.launchAtLogin;
    // Honest about what this does and does not cover: a login item starts the
    // app at login, but nothing relaunches it if the process dies. The
    // LaunchAgent in scripts/ does both - see docs/MAC_SETUP.md.
    $('launchHint').textContent = cfg.isPackaged
      ? '— starts at login; does not relaunch after a crash'
      : '— unavailable in development (would register Electron itself)';
    $('launchAtLogin').disabled = !cfg.isPackaged;
    // The stored password is deliberately never sent to this window - only
    // whether one exists. Blank means "keep what is already saved".
    $('pwHint').textContent = cfg.hasPassword ? '— already set' : '— not set yet';

    // Env vars win over this file, so saying so beats letting someone save a
    // value that never takes effect and wonder why the display ignored them.
    if (cfg.envOverrides && cfg.envOverrides.length) {
      const warn = $('envWarn');
      warn.textContent =
        `Set by environment variable, which overrides anything saved here: ${cfg.envOverrides.join(', ')}. ` +
        'Unset them for these settings to take effect.';
      warn.hidden = false;
    }
    $('portalUrl').focus();
  })();

  $('save').addEventListener('click', async () => {
    show('Saving…');
    $('save').disabled = true;

    const result = await window.portalSettings.save({
      portalUrl: $('portalUrl').value.trim(),
      password: $('password').value,
      localOffice: $('localOffice').value.trim(),
      remoteOffice: $('remoteOffice').value.trim(),
      kiosk: $('kiosk').checked,
      launchAtLogin: $('launchAtLogin').checked
    });

    $('save').disabled = false;
    if (result.ok) {
      show('Saved. Reconnecting…', 'ok');
    } else {
      show(result.error, 'err');
    }
  });

  $('cancel').addEventListener('click', () => window.portalSettings.close());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.portalSettings.close();
    if (e.key === 'Enter') $('save').click();
  });
</script>
</body>
</html>
